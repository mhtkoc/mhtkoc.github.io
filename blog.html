<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog | Muhammet Koç</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@400;600;700&family=Roboto+Slab:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Highlight.js Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />

    <!-- Core theme CSS -->
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/blog.css" rel="stylesheet" />

    <!-- Markdown & Syntax Highlighting Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@16.4.1/lib/marked.umd.min.js"></script>

    <!-- Anti-flicker Theme Initialization -->
    <script>
        (function () {
            const stored = localStorage.getItem('theme');
            const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = stored || (systemDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main.container {
            flex: 1;
            padding-top: 6rem;
            padding-bottom: 4rem;
        }

        .footer {
            margin-top: auto;
        }
    </style>
</head>

<body id="page-top">

    <!-- Navigation-->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark" id="mainNav">
        <div class="container">
            <a class="navbar-brand navbar-link" href="index.html#page-top">
                <img src="assets/img/white.svg" alt="MuhammetKoc"
                    style="filter: invert(73%) sepia(98%) saturate(749%) hue-rotate(359deg) brightness(1.05);" />
            </a>
            <div class="d-flex align-items-center gap-2 order-lg-last">
                <!-- Theme Toggle Button -->
                <button id="theme-toggle-btn" class="theme-toggle-btn ms-2" onclick="toggleTheme()" title="Temayı Değiştir" aria-label="Temayı Değiştir">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                    aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    Menu
                    <i class="fas fa-bars ms-1"></i>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0 align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html#about">Hakkımda</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#experiences">Deneyimler</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#portfolio">Projeler</a></li>
                    <li class="nav-item"><a class="nav-link active" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contact">İletişim</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div id="posts-list">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-warning mb-3" role="status"></div>
                <p>Blog yazıları yükleniyor...</p>
            </div>
        </div>
        <div id="post-content" style="display:none;"></div>
        <button id="back-btn" style="display:none;" class="btn btn-secondary mt-4">← Geri</button>
    </main>

    <!-- Footer -->
    <footer class="footer py-4 bg-dark text-white text-center">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-12 text-center">
                    &copy; mhtkoc.github.io 2025 - 2026. Tüm hakları saklıdır.
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Blog Post Logic -->
    <script src="js/post.js"></script>
</body>

</html>
